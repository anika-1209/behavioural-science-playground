# The v1.5 API (spec, "Backend"). The site itself is served by Cloudflare Pages.
# No secrets here: the repository is public. The D1 database id is not a secret.
name = "bsp-api"
main = "worker/index.ts"
compatibility_date = "2026-10-01"

# Recompute summaries and delete answers older than 12 months.
[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "bsp"
database_id = "00000000-0000-0000-0000-000000000000" # replace with the id from `wrangler d1 create bsp`
migrations_dir = "worker/migrations"

# Turn off request logging so IP addresses aren't kept (spec, "What is sent").
[observability]
enabled = false

# Rate limit for POST /api/answers and /api/events, per IP address, counted in
# Cloudflare's memory only. A real player sends a handful of requests a minute.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[vars]
# The site's address. The site and API are on different free Cloudflare
# addresses, so this allows the site's requests (CORS) and rejects POSTs from
# anywhere else. Replace with your Pages address, e.g. https://bsp.pages.dev
ALLOWED_ORIGIN = "https://REPLACE-ME.pages.dev"
